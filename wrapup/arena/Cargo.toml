[package]
name = "deflate-arena"
version = "0.1.0"
edition = "2021"
description = "Real-world harness for the competition's LZ77 parsers: streaming adapters, containers, references."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "arena"
path = "src/bin/arena.rs"

[dependencies]
# Same versions as validator/measure, so the shared pieces behave identically.
libloading = "0.8"
miniz_oxide = "0.8"
flate2 = { version = "1.0", features = ["zlib"], default-features = false }
libdeflater = "1.22"
crc32fast = "1.4"
adler2 = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zopfli = { version = "0.8", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug-assertions = false
overflow-checks = false
panic = "unwind"

# Tests run large round trips; keep them reasonably fast.
[profile.test]
opt-level = 2
