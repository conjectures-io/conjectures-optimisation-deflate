[package]
name = "harness"
version = "0.1.0"
edition = "2021"

[dependencies]
slot = { path = "../slot" }
# Two independent decoders for the round-trip check, and the reference bars.
miniz_oxide = "0.8"
flate2 = { version = "1.0", features = ["zlib"], default-features = false }
libdeflater = "1.22"

[profile.release]
opt-level = 3
