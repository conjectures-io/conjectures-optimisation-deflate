# The competition's Lean side.
#
# Run `just setup` before the first build: it points `.lake/packages` at a shared
# Mathlib + Aeneas checkout, or fetches one.
#
# Note there is deliberately NO `packagesDir =` line. Lake compares the configured
# packages directory against the one recorded in `lake-manifest.json`, and when
# they disagree it warns "packages directory changed" and then re-clones into the
# configured location, DELETING what is already there. That is not hypothetical:
# it destroyed a 7 GB shared Mathlib during development. `.lake/packages` is a
# symlink instead, so both paths agree and nothing is ever re-cloned.
name = "competition"
defaultTargets = ["Lz77", "Slot", "Proof", "Verify"]

[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas"
rev = "nightly-2026.08.27-5b9dcf3"
subDir = "backends/lean"

# The published contract and its lemma library. Written by the operator, pinned
# by hash, paid for ONCE. Miners import it and never edit it.
[[lean_lib]]
name = "Lz77"

# Generated from the miner's `parse.rs` by charon + aeneas. Never hand-edited,
# and re-generated by the verifier rather than accepted from the submission.
[[lean_lib]]
name = "Slot"

# The miner's proof. This is the per-patch cost.
[[lean_lib]]
name = "Proof"

# Written by the verifier on every submission and never by a miner: it applies
# the miner's theorem to the operator's statement, so a weakened statement fails
# to typecheck rather than having to be spotted by eye.
[[lean_lib]]
name = "Verify"
