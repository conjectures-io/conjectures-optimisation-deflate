[package]
name = "measure"
version = "0.1.0"
edition = "2021"

[dependencies]
libloading = "0.8"
# Two independent decoders for the round-trip check, and the reference bars.
miniz_oxide = "0.8"
flate2 = { version = "1.0", features = ["zlib"], default-features = false }
libdeflater = "1.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug-assertions = false
overflow-checks = false
panic = "unwind"
